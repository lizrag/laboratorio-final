name: Workflow
on:
    push:
        branches:
            - '**'
    workflow_dispatch:

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - name: Iniciando el pipeline
              run: echo "Inicio del pipeline:"
            
            - name: Checkout del código
              uses: actions/checkout@v3

            - name: Instalar dependencias
              run: npm install
    
    sast:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - name: Validando existencia de proyecto en SonarCloud
              id: validateProjectOnSonar
              run: |
                set +e
                response=$(curl -s -o /dev/null -w "%{http_code}" -X POST -u "${{ secrets.SONAR_TOKEN }}:" \
                "https://sonarcloud.io/api/projects/create" \
                -d "name=${{ github.event.repository.name }}" \
                -d "project=${{ github.event.repository.name }}" \
                -d "organization=${{ secrets.ORGANIZATION_SONAR }}" \
                -d "visibility=public")
            
                if [ "$response" -ne 200 ]; then
                    echo "Proyecto ya existente en SonarCloud o error al crear"
                    echo "proyectoExiste=1" >> $GITHUB_OUTPUT
                else
                    echo "Proyecto creado en SonarCloud"
                    echo "proyectoExiste=0" >> $GITHUB_OUTPUT

                fi
                set -e


            - name: SonarScan
              uses: SonarSource/sonarqube-scan-action@v5
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              with:
                projectBaseDir: .
                args: >
                    -Dsonar.projectKey=${{ secrets.PROJECT_KEY }}
                    -Dsonar.organization=${{ secrets.ORGANIZATION_SONAR }}
                    -Dsonar.qualitygate.wait=true